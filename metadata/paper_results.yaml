# Section 4.4 -- selective prediction (Fig 5)
selective_prediction:
  model: flan_palm_540b
  n_decodes: 41
  deferral_fraction: 0.45
  accuracy_at_deferral: 82.5

# A.2 -- variance of repeated MedQA evaluation (4 runs, best model)
variance_medqa_4runs: 0.078

# Qualitative findings the replication tests (Section 4.4 / 5)
findings:
  instruction_tuning_helps: "Flan-PaLM > PaLM on all MC datasets, all sizes (Table 5)"
  scaling_helps: "~2x accuracy from 8B to 540B (Section 4.4)"
  sc_beats_fewshot_medqa_medmcqa: "Table 7"
  sc_hurts_pubmedqa: "Table 7 (79.0 -> 75.2)"
  cot_not_better_than_fewshot_on_mc: "Table 6"
  selective_prediction_rises_with_deferral: "Fig 5 (up to 82.5% @ 0.45)"
