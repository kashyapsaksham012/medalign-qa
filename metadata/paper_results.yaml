  medmcqa:          {few_shot: 56.5, cot: 53.6}
  pubmedqa:         {few_shot: 79.0, cot: 77.2}

# Table 7 -- few-shot vs self-consistency (Flan-PaLM 540B)
table7:
  medqa_usmle_4opt: {few_shot: 60.3, sc: 67.6}
  medmcqa:          {few_shot: 56.5, sc: 57.6}
  pubmedqa:         {few_shot: 79.0, sc: 75.2}

# Table A.1 -- MMLU 6 subjects x {PaLM 540B few-shot, Flan-PaLM 540B few-shot / CoT / SC}
