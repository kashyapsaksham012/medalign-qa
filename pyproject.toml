[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medalign-qa"
version = "0.1.0"
description = "Faithful replication scaffold for 'Large Language Models Encode Clinical Knowledge' (Med-PaLM / MultiMedQA, arXiv:2212.13138v1)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
