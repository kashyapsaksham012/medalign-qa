# Substitute model for the Path B replication (RA-16) -- GROQ free tier.
# Groq dropped all Llama 3.1/3.3 instruct models; qwen3.8-27b is a current, clean
# general instruct model. Groq free tier: ~8000 tokens/minute -> ~4-5 requests/min
# with our ~1700-token few-shot prompts. Runs are slow but unattended (429 -> backoff).

model_env: MEDALIGN_MODEL_PRIMARY
model: qwen/qwen3.8-27b
base_url_env: MEDALIGN_API_BASE
provider: groq

price_in_per_m: 0.0        # free tier
price_out_per_m: 0.0

timeout: 60
max_retries: 8             # Groq 429s aggressively; more retries + backoff

decode:
  few_shot:   {temperature: 0.0, max_tokens: 12}
  cot:        {temperature: 0.0, max_tokens: 512}
  self_consistency: {temperature: 0.7, top_p: 0.95, max_tokens: 512, n: 11}
  selective_prediction: {temperature: 0.7, top_p: 0.95, max_tokens: 512, n: 41}

maps_to_paper_column: "no direct paper analogue (27B, 2026 model) -- SUBSTITUTE (RA-16)"
groq_free_tier_ceiling_req_per_min: 4.6
