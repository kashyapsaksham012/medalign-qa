# Primary substitute model for the Path B replication (RA-16).
# A GENERAL instruction-tuned model (NOT a medical fine-tune) -- faithful to the
# paper's use of a general LLM (PaLM/Flan-PaLM) evaluated purely via prompting.

model_env: MEDALIGN_MODEL_PRIMARY          # resolved from .env
model: meta-llama/llama-3.1-8b-instruct    # fallback if the env var is unset
base_url_env: MEDALIGN_API_BASE
provider: openrouter

# Approximate OpenRouter pricing (USD per 1M tokens) -- used only for cost tracking,
# not billing. Update if your provider/route differs.
price_in_per_m: 0.02
price_out_per_m: 0.03

timeout: 120
max_retries: 5

# Decode settings per strategy (PAPER-SPECIFIED where noted; else REPLICATION ASSUMPTION)
decode:
  few_shot:   {temperature: 0.0, max_tokens: 12}     # greedy single decode
  cot:        {temperature: 0.0, max_tokens: 512}    # greedy, room for reasoning
  self_consistency: {temperature: 0.7, top_p: 0.95, max_tokens: 512, n: 11}  # RA-03/RA-04; n=11 PAPER-SPECIFIED
  selective_prediction: {temperature: 0.7, top_p: 0.95, max_tokens: 512, n: 41}  # n=41 PAPER-SPECIFIED

maps_to_paper_column: "Flan-PaLM 8B (for per-size comparison)"
